workflows:
  android_only:
    name: SEAON HR Attendance App - Android APK Only
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
      java: 11
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch:
        include_patterns:
          - main
          - develop
    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
    publishing:
      google_play:
        credentials: Encrypted(...)
        track: internal
