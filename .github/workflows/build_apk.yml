name: Publish APK to Release

on:
  push:
    branches:
      - main
    paths:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Attach APKs to v1.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: |
            release/SEAON_HR_v1.0.0.apk
            release/SEAON_HR_v1.0.0_arm64.apk
            release/SEAON_HR_v1.0.0_armv7.apk
            release/SEAON_HR_USER_MANUAL_KO.md
