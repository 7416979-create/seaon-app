name: hr_attendance_app
description: 완전한 기능의 Flutter 근태관리 시스템 (GPS, WiFi, 2FA, 암호화, 백그라운드 추적)
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Material Design
  cupertino_icons: ^1.0.2

  # ==================== 핵심 기능 패키지 ====================

  # GPS 기반 위치 서비스 (출퇴근 위치 확인)
  geolocator: ^9.0.2
  location: ^5.0.1

  # WiFi 기반 인증 (회사 WiFi 확인)
  network_info_plus: ^4.0.2

  # 네트워크 연결 상태 모니터링
  connectivity_plus: ^5.0.0

  # 백그라운드 작업 (GPS 추적)
  workmanager: ^0.5.1

  # 로컬 알림
  flutter_local_notifications: ^14.1.1

  # 보안 저장소 (암호화)
  flutter_secure_storage: ^9.0.0

  # AES 암호화
  encrypt: ^5.0.1

  # 파일 시스템 (오프라인 데이터)
  path_provider: ^2.1.1

  # ==================== 공통 패키지 ====================

  # JSON 직렬화
  json_serializable: ^6.7.1

  # 날짜/시간 포맷팅
  intl: ^0.19.0

  # 로컬 저장소
  shared_preferences: ^2.2.0

  # HTTP 통신
  http: ^1.1.0

  # 이미지 처리 (디지털 서명)
  image: ^4.1.3

  # Google Sign-In (선택사항)
  google_sign_in: ^6.1.5

  # Google Drive API (선택사항)
  googleapis: ^11.4.0

  # Firebase (선택사항)
  firebase_core: ^2.24.0
  firebase_database: ^10.4.9
  firebase_auth: ^4.15.0
  firebase_storage: ^11.6.0

  # UI & State Management
  provider: ^6.0.0
  go_router: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  # assets 폴더 설정
  assets:
    - assets/images/
    - assets/icons/
    - assets/signatures/

  # fonts 폴더 설정
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
